version: '3.9'

services:
  api:
    image: ecommercehub-api:latest
    build:
      context: .
      dockerfile: src/EcommerceHub.API/Dockerfile
    container_name: ecommercehub-api
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommercehub;Username=postgres;Password=${POSTGRES_PASSWORD};
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=EcommerceHub
      - Jwt__Audience=EcommerceHub.Users
      - SendGrid__ApiKey=${SENDGRID_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommercehub-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  admin:
    image: ecommercehub-admin:latest
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: ecommercehub-admin
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - ecommercehub-net
    restart: unless-stopped

  customer:
    image: ecommercehub-customer:latest
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    container_name: ecommercehub-customer
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - ecommercehub-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ecommercehub-postgres
    environment:
      POSTGRES_DB: ecommercehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ecommercehub-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommercehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommercehub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ecommercehub-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: ecommercehub-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - admin
      - customer
    networks:
      - ecommercehub-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ecommercehub-net:
    driver: bridge
